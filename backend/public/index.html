<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bolão 2026</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ─────────────────────────────────────────────
   DESIGN TOKENS
───────────────────────────────────────────── */
:root {
  --bg:          #0A192F;
  --bg2:         #112240;
  --card:        #1B2A41;
  --card2:       #243454;
  --accent:      #3A86FF;
  --accent-dim:  rgba(58,134,255,0.12);
  --accent-border: rgba(58,134,255,0.3);
  --white:       #E6F1FF;
  --muted:       #8892B0;
  --muted2:      #4A5568;
  --border:      rgba(255,255,255,0.08);
  --border2:     rgba(255,255,255,0.04);
  --danger:      #EF4444;
  --danger-dim:  rgba(239,68,68,0.12);
  --success:     #22C55E;
  --success-dim: rgba(34,197,94,0.12);
  --gold:        #F59E0B;
  --gold-dim:    rgba(245,158,11,0.12);
  --silver:      #94A3B8;
  --bronze:      #B45309;
  --radius:      16px;
  --radius-sm:   10px;
  --shadow:      0 4px 24px rgba(0,0,0,0.3);
  --shadow-sm:   0 2px 8px rgba(0,0,0,0.2);
  --transition:  0.2s ease;
}

/* ─────────────────────────────────────────────
   RESET & BASE
───────────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--white);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button  { cursor: pointer; font-family: inherit; border: none; background: none; }
input, select, textarea { font-family: inherit; }
a { color: inherit; text-decoration: none; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--muted2); border-radius: 4px; }

/* ─────────────────────────────────────────────
   LAYOUT SHELL
───────────────────────────────────────────── */
#app { display: none; position: fixed; inset: 0; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 56px; flex-shrink: 0;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  position: relative; z-index: 40;
}
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-brand .brand-name {
  font-size: 16px; font-weight: 700; color: var(--white); letter-spacing: -0.3px;
}
.topbar-brand .brand-sub { font-size: 11px; color: var(--muted); }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

.pages { flex: 1; overflow: hidden; position: relative; }
.page {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  padding: 20px 16px 80px;
  display: none;
}
.page.active { display: block; }

.bottomnav {
  height: 58px; flex-shrink: 0;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex; align-items: stretch; z-index: 40;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px; color: var(--muted); transition: var(--transition);
  padding: 6px 0; position: relative;
}
.nav-btn svg { width: 20px; height: 20px; stroke-width: 1.75; }
.nav-btn span { font-size: 10px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active::after {
  content: ''; position: absolute; top: 0; left: 50%;
  transform: translateX(-50%); width: 32px; height: 2px;
  background: var(--accent); border-radius: 0 0 4px 4px;
}

/* ─────────────────────────────────────────────
   AUTH SCREEN
───────────────────────────────────────────── */
#auth-screen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); padding: 24px;
}
.auth-card {
  width: 100%; max-width: 400px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 28px;
  box-shadow: var(--shadow);
}
.auth-header { text-align: center; margin-bottom: 28px; }
.auth-header .auth-icon {
  width: 52px; height: 52px; border-radius: 14px;
  background: var(--accent-dim);
  border: 1px solid var(--accent-border);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px;
}
.auth-header .auth-icon svg { width: 26px; height: 26px; color: var(--accent); }
.auth-header h1 { font-size: 20px; font-weight: 700; color: var(--white); }
.auth-header p  { font-size: 13px; color: var(--muted); margin-top: 4px; }

.tab-row {
  display: flex; gap: 4px;
  background: var(--bg); border-radius: var(--radius-sm);
  padding: 4px; margin-bottom: 24px;
}
.tab-btn {
  flex: 1; padding: 8px; border-radius: 8px;
  font-size: 13px; font-weight: 600; color: var(--muted);
  transition: var(--transition);
}
.tab-btn.active { background: var(--card2); color: var(--white); }

.form-field {
  width: 100%; padding: 11px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--white); font-size: 14px;
  margin-bottom: 10px;
  transition: var(--transition);
  outline: none;
}
.form-field:focus { border-color: var(--accent); }
.form-field::placeholder { color: var(--muted2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 7px; padding: 11px 18px;
  border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
  transition: var(--transition); cursor: pointer; border: none; outline: none;
}
.btn:active { opacity: 0.8; transform: scale(0.98); }
.btn-primary { background: var(--accent); color: #fff; width: 100%; }
.btn-primary:hover { background: #2d74e8; }
.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted); width: 100%;
}
.btn-outline:hover { border-color: rgba(255,255,255,0.2); color: var(--white); }
.btn-ghost { background: transparent; color: var(--muted); padding: 8px; border-radius: 8px; }
.btn-ghost:hover { background: var(--border2); color: var(--white); }
.btn-danger { background: var(--danger-dim); color: var(--danger); width: 100%; }
.btn-danger:hover { background: rgba(239,68,68,0.2); }
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }

.divider {
  display: flex; align-items: center; gap: 12px;
  color: var(--muted2); font-size: 12px;
  margin: 14px 0;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.auth-error {
  font-size: 12px; color: var(--danger);
  background: var(--danger-dim); border-radius: 8px;
  padding: 9px 12px; margin-bottom: 14px;
  display: none;
}
.auth-error.visible { display: block; }

/* ─────────────────────────────────────────────
   CARDS & SURFACES
───────────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: var(--transition);
}
.card:hover { border-color: rgba(255,255,255,0.12); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border2);
}
.card-title { font-size: 13px; font-weight: 600; color: var(--white); }
.card-body { padding: 16px; }

/* ─────────────────────────────────────────────
   BADGES / CHIPS
───────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.2px;
}
.badge svg { width: 11px; height: 11px; }
.badge-accent  { background: var(--accent-dim);  color: var(--accent);  border: 1px solid var(--accent-border); }
.badge-success { background: var(--success-dim); color: var(--success); border: 1px solid rgba(34,197,94,0.25); }
.badge-danger  { background: var(--danger-dim);  color: var(--danger);  border: 1px solid rgba(239,68,68,0.25); }
.badge-gold    { background: var(--gold-dim);    color: var(--gold);    border: 1px solid rgba(245,158,11,0.25); }
.badge-muted   { background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid var(--border); }
.badge-live    {
  background: var(--danger-dim); color: var(--danger);
  border: 1px solid rgba(239,68,68,0.25);
  display: flex; align-items: center; gap: 5px;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--danger);
  animation: pulse-dot 1.2s ease infinite;
}
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ─────────────────────────────────────────────
   SECTION HEADERS
───────────────────────────────────────────── */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.section-action { font-size: 12px; color: var(--accent); font-weight: 600; background: none; border: none; cursor: pointer; }

/* ─────────────────────────────────────────────
   SKELETON LOADING
───────────────────────────────────────────── */
@keyframes shimmer {
  0%   { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
.skeleton {
  background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%);
  background-size: 800px 100%;
  animation: shimmer 1.4s ease infinite;
  border-radius: 8px;
}
.skel-line  { height: 14px; margin-bottom: 8px; }
.skel-card  { height: 100px; border-radius: var(--radius); margin-bottom: 12px; }
.skel-avatar{ width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }

/* ─────────────────────────────────────────────
   EMPTY STATE
───────────────────────────────────────────── */
.empty {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 10px;
  padding: 48px 24px; text-align: center;
}
.empty svg { width: 40px; height: 40px; color: var(--muted2); stroke-width: 1.25; }
.empty-title { font-size: 15px; font-weight: 600; color: var(--muted); }
.empty-sub   { font-size: 13px; color: var(--muted2); }

/* ─────────────────────────────────────────────
   AVATAR
───────────────────────────────────────────── */
.avatar {
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #fff; flex-shrink: 0; font-size: 13px;
}
.avatar-sm  { width: 32px; height: 32px; font-size: 12px; }
.avatar-md  { width: 40px; height: 40px; font-size: 14px; }
.avatar-lg  { width: 52px; height: 52px; font-size: 18px; }
.avatar-xl  { width: 64px; height: 64px; font-size: 22px; }

/* ─────────────────────────────────────────────
   NOTIFICATION PANEL
───────────────────────────────────────────── */
.notif-panel {
  position: fixed; top: 56px; right: 0;
  width: min(360px, 100vw); max-height: calc(100vh - 56px);
  overflow-y: auto;
  background: var(--bg2); border-left: 1px solid var(--border);
  border-radius: 0 0 0 var(--radius); z-index: 200;
  transform: translateX(110%); transition: transform 0.25s ease;
  box-shadow: var(--shadow);
}
.notif-panel.open { transform: translateX(0); }
.notif-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--bg2); z-index: 1;
}
.notif-panel-head h3 { font-size: 14px; font-weight: 700; }
.notif-badge-btn {
  position: relative; padding: 8px; border-radius: 8px;
  color: var(--muted); transition: var(--transition);
}
.notif-badge-btn:hover { background: var(--border2); color: var(--white); }
.notif-badge-btn svg { width: 20px; height: 20px; }
.notif-count {
  position: absolute; top: 4px; right: 4px;
  min-width: 16px; height: 16px; padding: 0 4px;
  background: var(--danger); border-radius: 8px;
  font-size: 10px; font-weight: 700; color: #fff;
  display: flex; align-items: center; justify-content: center;
}
.notif-count.hidden { display: none; }
.notif-item {
  padding: 14px 16px; border-bottom: 1px solid var(--border2);
  cursor: pointer; transition: var(--transition);
}
.notif-item:hover { background: var(--border2); }
.notif-item.unread { border-left: 2px solid var(--accent); }
.notif-item-title { font-size: 13px; font-weight: 600; color: var(--white); }
.notif-item-body  { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.notif-item-time  { font-size: 11px; color: var(--muted2); margin-top: 4px; }

/* ─────────────────────────────────────────────
   PAGE: RANKING
───────────────────────────────────────────── */
.podium {
  display: flex; align-items: flex-end; gap: 8px;
  padding: 4px 0 24px; justify-content: center;
}
.podium-slot {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  flex: 1; max-width: 108px;
}
.podium-avatar-wrap { position: relative; }
.podium-crown {
  position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
  font-size: 18px; pointer-events: none;
}
.podium-bar {
  width: 100%; border-radius: 8px 8px 0 0;
  background: var(--card2); border: 1px solid var(--border); border-bottom: none;
}
.podium-pos-1 .podium-bar { height: 80px; border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.06); }
.podium-pos-2 .podium-bar { height: 56px; }
.podium-pos-3 .podium-bar { height: 40px; }
.podium-pos-1 .avatar { border: 2px solid var(--gold);   box-shadow: 0 0 16px rgba(245,158,11,0.25); }
.podium-pos-2 .avatar { border: 2px solid var(--silver); }
.podium-pos-3 .avatar { border: 2px solid var(--bronze); }
.podium-name { font-size: 12px; font-weight: 600; color: var(--white); text-align: center; }
.podium-pts  { font-size: 15px; font-weight: 700; color: var(--accent); }
.podium-rank { font-size: 11px; color: var(--muted); }

.rank-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--radius-sm); margin-bottom: 6px;
  background: var(--card); border: 1px solid var(--border);
  transition: var(--transition);
}
.rank-item:hover { border-color: rgba(255,255,255,0.12); }
.rank-item.me { border-color: var(--accent-border); background: var(--accent-dim); }
.rank-pos { width: 24px; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.rank-info { flex: 1; min-width: 0; }
.rank-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
.rank-pts  { font-size: 15px; font-weight: 700; color: var(--white); }
.rank-var  { font-size: 11px; font-weight: 600; }
.rank-var.up { color: var(--success); }
.rank-var.dn { color: var(--danger); }
.rank-var.eq { color: var(--muted2); }

/* ─────────────────────────────────────────────
   PAGE: PALPITES / MATCH CARDS
───────────────────────────────────────────── */
.match-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 12px;
  overflow: hidden; transition: var(--transition);
}
.match-card:hover { border-color: rgba(255,255,255,0.12); box-shadow: var(--shadow-sm); }
.match-card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px 9px;
  border-bottom: 1px solid var(--border2);
}
.match-comp { font-size: 11px; color: var(--muted); font-weight: 500; }
.match-body {
  display: flex; align-items: center; padding: 20px 14px 16px; gap: 8px;
}
.match-team {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px;
}
.team-flag { font-size: 38px; line-height: 1; }
.team-name { font-size: 13px; font-weight: 600; text-align: center; color: var(--white); }
.team-code { font-size: 11px; color: var(--muted); }
.match-vs { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 88px; }
.score-live { display: flex; align-items: center; gap: 6px; }
.score-num { font-size: 30px; font-weight: 800; color: var(--white); font-variant-numeric: tabular-nums; }
.score-sep { font-size: 20px; color: var(--muted2); }
.match-bet-row {
  padding: 12px 14px 14px;
  background: rgba(0,0,0,0.15);
  border-top: 1px solid var(--border2);
}
.bet-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
.bet-inputs { display: flex; align-items: center; gap: 8px; }
.stepper {
  display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center;
}
.step-btn {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  background: var(--card2); color: var(--white); font-size: 18px;
  border: 1px solid var(--border); transition: var(--transition);
}
.step-btn:hover { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); }
.step-val {
  width: 42px; height: 36px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; text-align: center; font-size: 18px;
  font-weight: 700; color: var(--white); outline: none;
  transition: var(--transition);
}
.step-val:focus { border-color: var(--accent); }
.vs-sep { font-size: 13px; color: var(--muted2); font-weight: 600; flex-shrink: 0; }
.btn-save-bet {
  padding: 8px 16px; border-radius: 8px; flex-shrink: 0;
  background: var(--accent); color: #fff;
  font-size: 12px; font-weight: 600; letter-spacing: 0.2px;
  transition: var(--transition); opacity: 0.35; pointer-events: none;
}
.btn-save-bet.ready { opacity: 1; pointer-events: auto; }
.btn-save-bet.ready:hover { background: #2d74e8; }
.btn-save-bet.saved { background: var(--success); opacity: 1; pointer-events: auto; }
.date-label {
  font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.8px; padding: 4px 0 10px; display: flex; align-items: center; gap: 8px;
}
.date-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ─────────────────────────────────────────────
   PAGE: MATA-MATA
───────────────────────────────────────────── */
.bracket-scroll { overflow-x: auto; padding-bottom: 16px; }
.bracket-grid { display: flex; gap: 0; min-width: 560px; align-items: flex-start; }
.bracket-col { display: flex; flex-direction: column; min-width: 150px; }
.bracket-col-title {
  font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.8px; text-align: center; padding: 8px 6px 12px;
}
.bracket-matches { display: flex; flex-direction: column; padding: 0 6px; gap: 10px; }
.bracket-match {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); overflow: hidden; min-width: 138px;
  transition: var(--transition);
}
.bracket-match:hover { border-color: rgba(255,255,255,0.14); }
.bslot {
  display: flex; align-items: center; gap: 7px; padding: 8px 10px;
  font-size: 12px; font-weight: 500; color: var(--white);
}
.bslot:first-child { border-bottom: 1px solid var(--border2); }
.bslot.winner { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
.bflag { font-size: 16px; flex-shrink: 0; }
.bname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bscore { font-size: 13px; font-weight: 700; color: var(--muted); min-width: 16px; text-align: right; }
.bscore.w { color: var(--accent); }
.b-tbd { font-size: 11px; color: var(--muted2); font-style: italic; }
.bracket-sep { width: 12px; align-self: stretch; display: flex; align-items: center; flex-shrink: 0; }
.bracket-sep-line { width: 100%; height: 1px; background: var(--border); }

/* ─────────────────────────────────────────────
   PAGE: GRUPOS
───────────────────────────────────────────── */
.group-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
  transition: var(--transition);
}
.group-card:hover { border-color: rgba(255,255,255,0.14); cursor: pointer; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.group-card-body { padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.group-icon {
  width: 42px; height: 42px; border-radius: 12px;
  background: var(--accent-dim); border: 1px solid var(--accent-border);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.group-icon svg { width: 20px; height: 20px; color: var(--accent); }
.group-info { flex: 1; min-width: 0; }
.group-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group-meta  { font-size: 12px; color: var(--muted); margin-top: 2px; }
.group-rank  { text-align: right; }
.group-rank-num { font-size: 18px; font-weight: 700; color: var(--accent); }
.group-rank-lbl { font-size: 10px; color: var(--muted); }

.create-group-card {
  background: transparent; border: 1px dashed rgba(255,255,255,0.12);
  border-radius: var(--radius); padding: 20px; margin-bottom: 10px;
  text-align: center; cursor: pointer; transition: var(--transition);
}
.create-group-card:hover { border-color: var(--accent-border); background: var(--accent-dim); }
.create-group-card svg { width: 28px; height: 28px; color: var(--muted2); margin-bottom: 8px; }
.create-group-card:hover svg { color: var(--accent); }
.create-group-card .cgc-title { font-size: 14px; font-weight: 600; color: var(--muted); }
.create-group-card:hover .cgc-title { color: var(--accent); }
.create-group-card .cgc-sub { font-size: 12px; color: var(--muted2); margin-top: 3px; }

/* ─────────────────────────────────────────────
   PAGE: MENU
───────────────────────────────────────────── */
.profile-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
  display: flex; align-items: center; gap: 14px;
}
.profile-info { flex: 1; min-width: 0; }
.profile-name { font-size: 17px; font-weight: 700; }
.profile-user { font-size: 13px; color: var(--muted); margin-top: 2px; }
.profile-level {
  display: inline-flex; align-items: center; gap: 5px;
  margin-top: 8px; padding: 3px 9px; border-radius: 20px;
  background: var(--accent-dim); border: 1px solid var(--accent-border);
  font-size: 11px; font-weight: 700; color: var(--accent);
}
.xp-bar { height: 4px; background: var(--bg); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.xp-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.8s ease; }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
.stat-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px 12px; text-align: center;
}
.stat-val { font-size: 20px; font-weight: 700; color: var(--white); }
.stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

.menu-list { display: flex; flex-direction: column; gap: 6px; }
.menu-row {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: var(--radius-sm);
  background: var(--card); border: 1px solid var(--border);
  cursor: pointer; transition: var(--transition);
}
.menu-row:hover { border-color: rgba(255,255,255,0.12); background: var(--card2); }
.menu-row svg { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
.menu-row-label { flex: 1; font-size: 14px; font-weight: 500; }
.menu-row-right { font-size: 12px; color: var(--muted2); }
.menu-row.danger svg { color: var(--danger); }
.menu-row.danger .menu-row-label { color: var(--danger); }

.toggle {
  width: 42px; height: 24px; border-radius: 12px;
  background: var(--muted2); position: relative; cursor: pointer;
  border: none; transition: background 0.25s;
}
.toggle.on { background: var(--accent); }
.toggle-knob {
  position: absolute; top: 3px; left: 3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; transition: left 0.25s;
}
.toggle.on .toggle-knob { left: 21px; }

/* ─────────────────────────────────────────────
   MODAL
───────────────────────────────────────────── */
.modal-bg {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  display: none; align-items: flex-end; justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  width: min(480px, 100vw);
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 20px 20px 36px; max-height: 85vh; overflow-y: auto;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-handle {
  width: 32px; height: 3px; background: var(--muted2);
  border-radius: 2px; margin: 0 auto 18px;
}
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }

/* ─────────────────────────────────────────────
   TOAST
───────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 76px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--card2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 18px;
  font-size: 13px; font-weight: 500; color: var(--white);
  opacity: 0; transition: 0.25s; pointer-events: none;
  white-space: nowrap; z-index: 999; box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─────────────────────────────────────────────
   UTILITY
───────────────────────────────────────────── */
.flex   { display: flex; }
.items-center { align-items: center; }
.gap-8  { gap: 8px; }
.gap-12 { gap: 12px; }
.flex-1 { flex: 1; }
.mt-4   { margin-top: 4px; }
.mt-8   { margin-top: 8px; }
.mt-16  { margin-top: 16px; }
.mb-16  { margin-bottom: 16px; }
.text-muted  { color: var(--muted); }
.text-accent { color: var(--accent); }
.text-sm     { font-size: 12px; }
.text-xs     { font-size: 11px; }
.fw-600 { font-weight: 600; }
.fw-700 { font-weight: 700; }
</style>
</head>
<body>

<script>
/* ══════════════════════════════════════════════
   FLAGS
══════════════════════════════════════════════ */
const FLAGS = {
  BRA:'🇧🇷',ARG:'🇦🇷',FRA:'🇫🇷',GER:'🇩🇪',
  ENG:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',ESP:'🇪🇸',POR:'🇵🇹',URU:'🇺🇾',
  MEX:'🇲🇽',USA:'🇺🇸',JPN:'🇯🇵',MAR:'🇲🇦',
  NED:'🇳🇱',SUI:'🇨🇭',CRO:'🇭🇷',POL:'🇵🇱',DEN:'🇩🇰',KOR:'🇰🇷',
};
const flag = t => FLAGS[t?.shortName] || FLAGS[t?.country?.toUpperCase()] || '—';

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
const S = {
  token: localStorage.getItem('token') || '',
  user: null,
  matches: [],
  bets: [],
  ranking: [],
  groups: [],
  notifications: [],
  wcGroups: [],
  page: 'palpites',
  loading: {},
  notifOpen: false,
};

function setLoading(key, val) { S.loading[key] = val; }
function isLoading(key) { return !!S.loading[key]; }

/* ══════════════════════════════════════════════
   API
══════════════════════════════════════════════ */
async function api(method, path, body) {
  try {
    const r = await fetch('/api' + path, {
      method,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token },
      body: body ? JSON.stringify(body) : undefined,
    });
    return r.json();
  } catch { return { error: 'Erro de conexão' }; }
}

/* ══════════════════════════════════════════════
   AUTH
══════════════════════════════════════════════ */
function switchTab(t) {
  ['login','register'].forEach(k => {
    document.getElementById('tab-'+k).style.display = k===t ? '' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach((b,i) =>
    b.classList.toggle('active', (t==='login')===!i));
  clearAuthErr();
}

async function doLogin() {
  const email = q('#l-email').value.trim(), password = q('#l-pass').value;
  if (!email || !password) return setAuthErr('Preencha todos os campos');
  const d = await api('POST', '/auth/login', { email, password });
  if (d.error) return setAuthErr(d.error);
  onAuth(d.token, d.user);
}

async function doRegister() {
  const displayName = q('#r-name').value.trim();
  const username    = q('#r-user').value.trim().replace('@','');
  const email       = q('#r-email').value.trim();
  const password    = q('#r-pass').value;
  if (!displayName||!username||!email||!password) return setAuthErr('Preencha todos os campos');
  const d = await api('POST', '/auth/register', { displayName, username, email, password });
  if (d.error) return setAuthErr(d.error);
  onAuth(d.token, d.user);
}

async function doDemo() {
  const d = await api('POST', '/auth/demo', {});
  if (d.error) return setAuthErr(d.error);
  onAuth(d.token, d.user);
}

function setAuthErr(msg) {
  const el = q('#auth-err');
  el.textContent = msg; el.classList.add('visible');
}
function clearAuthErr() { q('#auth-err').classList.remove('visible'); }

function onAuth(token, user) {
  S.token = token; S.user = user;
  localStorage.setItem('token', token);
  q('#auth-screen').style.display = 'none';
  q('#app').style.display = 'flex';
  initApp();
}

async function tryAutoLogin() {
  if (!S.token) return showAuth();
  const d = await api('GET', '/auth/me');
  if (!d || d.error || !d.id) return showAuth();
  S.user = d;
  q('#auth-screen').style.display = 'none';
  q('#app').style.display = 'flex';
  initApp();
}

function showAuth() {
  q('#auth-screen').style.display = 'flex';
  q('#app').style.display = 'none';
}

async function doLogout() {
  await api('POST', '/auth/logout');
  S.token = ''; localStorage.removeItem('token');
  showAuth();
}

/* ══════════════════════════════════════════════
   BOOT / SYNC
══════════════════════════════════════════════ */
async function initApp() {
  renderTopbarAvatar();
  goPage('palpites');
  await syncAll();
  setInterval(syncAll, 30000);
}

async function syncAll() {
  const [matches, bets, ranking, groups, notifs, wcGroups] = await Promise.all([
    api('GET', '/matches'),
    api('GET', '/bets'),
    api('GET', '/rankings/global'),
    api('GET', '/clubs'),
    api('GET', '/notifications'),
    api('GET', '/worldcup/groups'),
  ]);
  if (Array.isArray(matches))  S.matches  = matches;
  if (Array.isArray(bets))     S.bets     = bets;
  if (Array.isArray(ranking))  S.ranking  = ranking;
  if (Array.isArray(groups))   S.groups   = groups;
  if (Array.isArray(notifs))   S.notifications = notifs;
  if (Array.isArray(wcGroups)) S.wcGroups = wcGroups;
  renderCurrentPage();
  renderNotifCount();
  const t = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  setInner('rank-updated', 'Atualizado às ' + t);
}

function renderTopbarAvatar() {
  const av = q('#topbar-av');
  if (!av || !S.user) return;
  av.style.background = S.user.avatarColor || '#3A86FF';
  av.textContent = S.user.avatarInitials || '?';
}

/* ══════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════ */
function goPage(name) {
  S.page = name;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
  q('#page-'+name)?.classList.add('active');
  q('#nav-'+name)?.classList.add('active');
  renderCurrentPage();
}

function renderCurrentPage() {
  const r = {
    palpites: renderPalpites,
    bracket:  renderBracket,
    grupos:   renderGrupos,
    ranking:  renderRanking,
    menu:     renderMenu,
  };
  r[S.page]?.();
}

/* ══════════════════════════════════════════════
   SKELETONS
══════════════════════════════════════════════ */
function skeletonCards(n=3) {
  return Array.from({length:n}).map(()=>`
    <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px">
      <div class="flex items-center gap-12" style="margin-bottom:16px">
        <div class="skeleton" style="width:80px;height:12px;border-radius:6px"></div>
        <div style="flex:1"></div>
        <div class="skeleton" style="width:50px;height:12px;border-radius:6px"></div>
      </div>
      <div class="flex items-center gap-8">
        <div class="flex flex-1" style="flex-direction:column;align-items:center;gap:8px">
          <div class="skeleton" style="width:44px;height:44px;border-radius:8px"></div>
          <div class="skeleton" style="width:60px;height:10px;border-radius:5px"></div>
        </div>
        <div class="skeleton" style="width:70px;height:36px;border-radius:8px"></div>
        <div class="flex flex-1" style="flex-direction:column;align-items:center;gap:8px">
          <div class="skeleton" style="width:44px;height:44px;border-radius:8px"></div>
          <div class="skeleton" style="width:60px;height:10px;border-radius:5px"></div>
        </div>
      </div>
    </div>`).join('');
}

function skeletonRankRows(n=5) {
  return Array.from({length:n}).map(()=>`
    <div class="flex items-center gap-12" style="padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px">
      <div class="skeleton" style="width:20px;height:14px;border-radius:4px"></div>
      <div class="skeleton skel-avatar"></div>
      <div style="flex:1">
        <div class="skeleton" style="width:120px;height:13px;border-radius:5px;margin-bottom:5px"></div>
        <div class="skeleton" style="width:70px;height:10px;border-radius:4px"></div>

/* ══════════════════════════════════════════════
   PAGE: PALPITES
══════════════════════════════════════════════ */
function renderPalpites() {
  const c = q('#palpites-body');
  if (!c) return;

  if (!S.matches.length) {
    c.innerHTML = skeletonCards(4); return;
  }

  const order = { live:0, scheduled:1, finished:2 };
  const sorted = [...S.matches].sort((a,b) =>
    order[a.status]-order[b.status] || new Date(a.kickoffAt)-new Date(b.kickoffAt));

  let html = '', lastDate = '';
  sorted.forEach(m => {
    const d = fmtDate(m.kickoffAt);
    if (d !== lastDate) {
      html += `<div class="date-label">${d}</div>`;
      lastDate = d;
    }
    html += matchCard(m);
  });
  c.innerHTML = html;
}

function matchCard(m) {
  const bet  = S.bets.find(b => b.matchId === m.id);
  const hf   = flag(m.homeTeam), af = flag(m.awayTeam);
  const live = m.status === 'live', fin = m.status === 'finished', sched = m.status === 'scheduled';

  /* header right */
  const timeEl = live
    ? `<span class="badge badge-live"><span class="live-dot"></span>${m.minute||''}′</span>`
    : fin
      ? `<span class="badge badge-muted">Encerrado</span>`
      : `<span class="text-muted text-xs">${fmtTime(m.kickoffAt)}</span>`;

  const stageEl = m.stage === 'final' ? `<span class="badge badge-gold">Final</span>`
    : m.stage === 'sf' ? `<span class="badge badge-accent">Semifinal</span>`
    : m.stage === 'qf' ? `<span class="badge badge-accent">Quartas</span>`
    : m.stage === 'r16' ? `<span class="badge badge-muted">Oitavas</span>`
    : m.groupName ? `<span class="badge badge-muted">Grupo ${m.groupName}</span>` : '';

  /* center display */
  let vsEl;
  if (live || fin) {
    vsEl = `<div class="score-live">
      <span class="score-num">${m.homeScore??0}</span>
      <span class="score-sep">×</span>
      <span class="score-num">${m.awayScore??0}</span>
    </div>
    <div class="text-xs text-muted" style="margin-top:2px">${fin?'Final':'Ao vivo'}</div>`;
  } else if (bet) {
    vsEl = `<div class="score-live">
      <span class="score-num" style="color:var(--accent)">${bet.predictedHome}</span>
      <span class="score-sep">×</span>
      <span class="score-num" style="color:var(--accent)">${bet.predictedAway}</span>
    </div>
    <div class="text-xs text-muted" style="margin-top:2px">Palpite salvo</div>`;
  } else {
    vsEl = `<div class="text-xs text-muted" style="text-align:center;line-height:1.6">Faça<br>palpite</div>`;
  }

  /* bet section */
  let betEl = '';
  if (sched) {
    const bh = bet != null ? bet.predictedHome : '', ba = bet != null ? bet.predictedAway : '';
    const rdy = bh !== '' && ba !== '' ? ' ready' : '';
    const sv  = bet ? ' saved' : '';
    const lbl = bet ? 'Salvo' : 'Salvar';
    betEl = `<div class="match-bet-row">
      <div class="bet-label">Seu palpite</div>
      <div class="bet-inputs">
        <div class="stepper">
          <button class="step-btn" onclick="step('${m.id}','h',-1)">−</button>
          <input class="step-val" id="bh-${m.id}" type="number" min="0" max="20" value="${bh}" placeholder="0" oninput="onInput('${m.id}')"/>
          <button class="step-btn" onclick="step('${m.id}','h',1)">+</button>
        </div>
        <span class="vs-sep">×</span>
        <div class="stepper">
          <button class="step-btn" onclick="step('${m.id}','a',-1)">−</button>
          <input class="step-val" id="ba-${m.id}" type="number" min="0" max="20" value="${ba}" placeholder="0" oninput="onInput('${m.id}')"/>
          <button class="step-btn" onclick="step('${m.id}','a',1)">+</button>
        </div>
        <button id="bs-${m.id}" class="btn-save-bet${rdy}${sv}" onclick="saveBet('${m.id}')">${lbl}</button>
      </div>
    </div>`;
  } else if (fin && bet) {
    const pts = bet.points ?? 0;
    const chip = bet.status === 'won'
      ? (bet.isExact ? `<span class="badge badge-gold">Exato +${pts}pts</span>` : `<span class="badge badge-success">+${pts}pts</span>`)
      : `<span class="badge badge-danger">Errou</span>`;
    betEl = `<div class="match-bet-row" style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <div class="bet-label">Seu palpite</div>
        <div style="font-size:18px;font-weight:700;color:var(--white)">${bet.predictedHome} × ${bet.predictedAway}</div>
      </div>
      ${chip}
    </div>`;
  }

  return `<div class="match-card">
    <div class="match-card-head">
      <span class="match-comp">${m.competition} · ${m.round}</span>
      <div style="display:flex;align-items:center;gap:6px">${stageEl}${timeEl}</div>
    </div>
    <div class="match-body">
      <div class="match-team">
        <div class="team-flag">${hf}</div>
        <div class="team-name">${m.homeTeam.name}</div>
        <div class="team-code">${m.homeTeam.shortName}</div>
      </div>
      <div class="match-vs">${vsEl}</div>
      <div class="match-team">
        <div class="team-flag">${af}</div>
        <div class="team-name">${m.awayTeam.name}</div>
        <div class="team-code">${m.awayTeam.shortName}</div>
      </div>
    </div>
    ${betEl}
  </div>`;
}

function step(mid, side, d) {
  const el = q(`#b${side}-${mid}`);
  if (!el) return;
  el.value = Math.max(0, Math.min(20, (parseInt(el.value)||0) + d));
  onInput(mid);
}

function onInput(mid) {
  const bh = q(`#bh-${mid}`), ba = q(`#ba-${mid}`), btn = q(`#bs-${mid}`);
  if (!btn) return;
  const ready = bh?.value !== '' && ba?.value !== '';
  btn.classList.toggle('ready', ready);
  btn.classList.remove('saved');
  btn.textContent = 'Salvar';
}

async function saveBet(mid) {
  const bh = parseInt(q(`#bh-${mid}`)?.value);
  const ba = parseInt(q(`#ba-${mid}`)?.value);
  if (isNaN(bh)||isNaN(ba)) return;
  const btn = q(`#bs-${mid}`);
  if (btn) { btn.textContent = '...'; btn.style.pointerEvents = 'none'; }
  const d = await api('POST', '/bets', { matchId:mid, predictedHome:bh, predictedAway:ba });
  if (d.error) {
    toast(d.error);
    if (btn) { btn.textContent = 'Salvar'; btn.style.pointerEvents = ''; }
    return;
  }
  const idx = S.bets.findIndex(b => b.matchId===mid);
  if (idx !== -1) S.bets[idx] = d; else S.bets.push(d);
  if (btn) { btn.classList.add('saved'); btn.textContent = 'Salvo'; btn.style.pointerEvents = ''; }
  toast(`Palpite ${bh}×${ba} salvo`);
}

/* ══════════════════════════════════════════════
   PAGE: BRACKET
══════════════════════════════════════════════ */
function renderBracket() {
  const c = q('#bracket-body');
  if (!c) return;

  // Group matches from API by stage
  const stageOrder = { r16:'Oitavas', qf:'Quartas', sf:'Semifinal', final:'Final' };
  const stageKeys  = ['r16','qf','sf','final'];
  const byStage = {};
  stageKeys.forEach(k => { byStage[k] = []; });
  S.matches.forEach(m => { if (m.stage && byStage[m.stage]) byStage[m.stage].push(m); });

  const hasAnyKO = stageKeys.some(k => byStage[k].length > 0);
  if (!hasAnyKO) {
    c.innerHTML = `<div class="empty">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
      <div class="empty-title">Fase eliminatória não iniciada</div>
      <div class="empty-sub">Os confrontos aparecerão aqui quando a fase de grupos terminar</div>
    </div>`;
    return;
  }

  let html = `<div class="bracket-scroll"><div class="bracket-grid">`;
  stageKeys.forEach((sk, ri) => {
    const rounds = byStage[sk];
    if (!rounds.length) return;
    html += `<div class="bracket-col">
      <div class="bracket-col-title">${stageOrder[sk]}</div>
      <div class="bracket-matches" style="justify-content:space-around">`;
    rounds.forEach(m => {
      const fin = m.status === 'finished';
      const hW = fin && (m.homeScore??0) > (m.awayScore??0);
      const aW = fin && (m.awayScore??0) > (m.homeScore??0);
      const hf = flag(m.homeTeam), af = flag(m.awayTeam);
      html += `<div class="bracket-match">
        <div class="bslot${hW?' winner':''}">
          <span class="bflag">${hf}</span>
          <span class="bname">${m.homeTeam.name}</span>
          ${fin ? `<span class="bscore${hW?' w':''}">${m.homeScore}</span>` : '<span class="b-tbd">A definir</span>'}
        </div>
        <div class="bslot${aW?' winner':''}">
          <span class="bflag">${af}</span>
          <span class="bname">${m.awayTeam.name}</span>
          ${fin ? `<span class="bscore${aW?' w':''}">${m.awayScore}</span>` : '<span class="b-tbd">A definir</span>'}
        </div>
      </div>`;
    });
    html += `</div></div>`;
    const remaining = stageKeys.slice(ri+1).some(k => byStage[k].length > 0);
    if (remaining) html += `<div class="bracket-sep"><div class="bracket-sep-line"></div></div>`;
  });
  html += `</div></div>`;
  c.innerHTML = html;
}

function renderRanking() {
  const c = q('#ranking-body');
  if (!c) return;

  if (!S.ranking.length) {
    c.innerHTML = skeletonRankRows(6); return;
  }

  const [r1,r2,r3] = S.ranking;

  let html = `<div class="podium">
    ${podiumSlot(r2,2)}
    ${podiumSlot(r1,1)}
    ${podiumSlot(r3,3)}
  </div>`;

  html += S.ranking.slice(3).map(u => rankItem(u)).join('');
  c.innerHTML = html;
}

function podiumSlot(u, pos) {
  if (!u) return `<div class="podium-slot podium-pos-${pos}"></div>`;
  const isMe = u.id === S.user?.id;
  const medals = {1:'1st',2:'2nd',3:'3rd'};
  return `<div class="podium-slot podium-pos-${pos}">
    <div class="podium-rank">${medals[pos]}</div>
    <div class="podium-avatar-wrap">
      ${pos===1?'<span class="podium-crown">&#x1F451;</span>':''}
      <div class="avatar avatar-md" style="background:${u.avatarColor||'#3A86FF'}">${u.avatarInitials||'?'}</div>
    </div>
    <div class="podium-name">${u.displayName?.split(' ')[0]||''}${isMe?' (você)':''}</div>
    <div class="podium-pts">${u.points}</div>
    <div class="podium-bar"></div>
  </div>`;
}

function rankItem(u) {
  const isMe = u.id === S.user?.id;
  const varEl = u.rankVariation > 0
    ? `<span class="rank-var up">+${u.rankVariation}</span>`
    : u.rankVariation < 0
      ? `<span class="rank-var dn">${u.rankVariation}</span>`
      : `<span class="rank-var eq">—</span>`;
  return `<div class="rank-item${isMe?' me':''}">
    <div class="rank-pos">${u.rank}</div>
    <div class="avatar avatar-sm" style="background:${u.avatarColor||'#3A86FF'}">${u.avatarInitials||'?'}</div>
    <div class="rank-info">
      <div class="rank-name">${u.displayName}${isMe?' <span class="text-xs text-accent">(você)</span>':''}</div>
      <div class="rank-meta">${u.accuracy}% precisão${u.streak>0?' · '+u.streak+' seg.':''}</div>
    </div>
    <div style="text-align:right">
      <div class="rank-pts">${u.points}</div>
      ${varEl}
    </div>
  </div>`;
}

  if (!el) return;
  el.textContent = unread;
  el.classList.toggle('hidden', unread===0);
}

function renderNotifList() {
  const c = q('#notif-list');
  if (!c) return;
  if (!S.notifications.length) {
    c.innerHTML = `<div class="empty" style="padding:32px 24px">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="36" height="36"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div class="empty-title">Sem notificações</div>
    </div>`; return;
  }
  c.innerHTML = S.notifications.map(n => `
    <div class="notif-item${n.read?'':' unread'}" onclick="readNotif('${n.id}')">
      <div class="notif-item-title">${n.title}</div>
      <div class="notif-item-body">${n.body}</div>
      <div class="notif-item-time">${relTime(n.createdAt)}</div>
    </div>`).join('');
}

function readNotif(id) {
  const n = S.notifications.find(n=>n.id===id);
  if (n) n.read = true;
  renderNotifList(); renderNotifCount();
}

async function markAllRead() {
  await api('POST', '/notifications/read-all');
  S.notifications.forEach(n=>n.read=true);
  renderNotifList(); renderNotifCount();
}

/* ══════════════════════════════════════════════
   GROUPS
══════════════════════════════════════════════ */
function openGroupDetail(gid) {
  const g = S.groups.find(g=>g.id===gid);
  if (!g) return;
  const body = q('#group-detail-body');
  if (!body) return;

  const memberLines = g.members.map((m,i) => {
    const u = S.ranking.find(u=>u.id===m.userId) || { displayName:'Membro', avatarInitials:'?', avatarColor:'#3A86FF' };
    return `<div class="rank-item" style="margin-bottom:6px">
      <div class="rank-pos">${i+1}</div>
      <div class="avatar avatar-sm" style="background:${u.avatarColor||'#3A86FF'}">${u.avatarInitials||'?'}</div>
      <div class="rank-info"><div class="rank-name">${u.displayName}</div></div>
      <div class="rank-pts">${m.points} pts</div>
    </div>`;
  }).join('');

  const chatLines = g.chat.map(msg => {
    const u = S.ranking.find(u=>u.id===msg.userId) || { displayName:'?', avatarInitials:'?', avatarColor:'#3A86FF' };
    return `<div style="display:flex;gap:8px;margin-bottom:10px">
      <div class="avatar avatar-sm" style="background:${u.avatarColor||'#3A86FF'};flex-shrink:0;margin-top:2px">${u.avatarInitials||'?'}</div>
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--white)">${u.displayName}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:2px">${msg.content}</div>
        <div class="text-xs text-muted" style="margin-top:3px">${relTime(msg.createdAt)}</div>
      </div>
    </div>`;
  }).join('');

  body.innerHTML = `
    <div class="modal-title">${g.name}</div>
    <div style="margin-bottom:14px;display:flex;align-items:center;gap:8px">
      <span class="badge badge-muted">Código: ${g.inviteCode}</span>
      <span class="badge badge-muted">${g.members.length} membros</span>
    </div>
    <div class="section-title" style="margin-bottom:10px">Ranking do grupo</div>
    ${memberLines}
    <div class="section-title" style="margin:16px 0 10px">Chat</div>
    <div style="max-height:180px;overflow-y:auto;margin-bottom:10px">${chatLines||'<div class="text-sm text-muted">Nenhuma mensagem</div>'}</div>
    <div style="display:flex;gap:8px">
      <input id="chat-${g.id}" class="form-field" placeholder="Mensagem..." style="margin-bottom:0;flex:1"
        onkeydown="if(event.key==='Enter')sendChat('${g.id}')"/>
      <button class="btn btn-primary" style="width:auto;padding:11px 16px;flex-shrink:0" onclick="sendChat('${g.id}')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>`;

  openModal('group-detail');
}

async function sendChat(gid) {
  const inp = q(`#chat-${gid}`);
  const content = inp?.value.trim();
  if (!content) return;
  await api('POST', `/clubs/${gid}/chat`, { content });
  inp.value = '';
  const groups = await api('GET', '/clubs');
  if (Array.isArray(groups)) { S.groups = groups; openGroupDetail(gid); }
}

async function doCreateGroup() {
  const name = q('#cg-name').value.trim();
  const type = q('#cg-type').value;
  const password = q('#cg-pass').value;
  if (!name) return toast('Nome do grupo obrigatório');
  const d = await api('POST', '/clubs', { name, type, password });
  if (d.error) return toast(d.error);
  S.groups.push(d);
  closeModal('create');
  toast('Grupo criado com sucesso');
  goPage('grupos');
}

async function doJoinGroup() {
  const inviteCode = q('#jg-code').value.trim().toUpperCase();
  const password   = q('#jg-pass').value;
  if (!inviteCode) return toast('Código obrigatório');
  const d = await api('POST', '/clubs/join', { inviteCode, password });
  if (d.error) return toast(d.error);
  closeModal('join');
  toast('Entrou no grupo');
  const groups = await api('GET', '/clubs');
  if (Array.isArray(groups)) { S.groups = groups; renderGrupos(); }
}

q('#cg-type')?.addEventListener('change', function() {
  const p = q('#cg-pass');
  if (p) p.style.display = this.value === 'private' ? '' : 'none';
});

/* ══════════════════════════════════════════════
   MODALS
══════════════════════════════════════════════ */
function openModal(name)  { q('#modal-'+name)?.classList.add('open'); }
function closeModal(name) { q('#modal-'+name)?.classList.remove('open'); }

/* ══════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════ */
let _tt;
function toast(msg) {
  const el = q('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
function q(sel) { return document.querySelector(sel); }
function setInner(id, html) { const el = q('#'+id); if (el) el.innerHTML = html; }

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function relTime(iso) {
  const d = Date.now()-new Date(iso).getTime();
  const m=Math.floor(d/60000), h=Math.floor(d/3600000), dy=Math.floor(d/86400000);
  if (m<1) return 'agora'; if (m<60) return m+'min'; if (h<24) return h+'h'; return dy+'d';
}

/* ══════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════ */
tryAutoLogin();
</script>
